<meta name="theme-color" content="#F6F5F1">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --surface2:#EFEEE9; --ink:#1B1D21; --muted:#6B6F76; --line:#DCDBD5;
  --accent:#2A7A72; --accent-ink:#FFFFFF; --accent-soft:#E1EFEC;
  --good:#2E7D4F; --good-soft:#DFF0E5; --warn:#A8721C; --warn-soft:#F6EBD3; --bad:#B23A3A; --bad-soft:#F5DEDE;
  --shadow:0 1px 2px rgba(20,22,26,.06),0 8px 24px rgba(20,22,26,.06);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans KR","IBM Plex Sans","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#15171A; --surface:#1E2126; --surface2:#262A30; --ink:#ECEAE4; --muted:#9AA0A8; --line:#2E3339;
  --accent:#62B8AE; --accent-ink:#0F1A18; --accent-soft:#1F3532;
  --good:#6CC08F; --good-soft:#1E3327; --warn:#E0B060; --warn-soft:#3A2F17; --bad:#E27C7C; --bad-soft:#3B2222;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15171A; --surface:#1E2126; --surface2:#262A30; --ink:#ECEAE4; --muted:#9AA0A8; --line:#2E3339;
  --accent:#62B8AE; --accent-ink:#0F1A18; --accent-soft:#1F3532;
  --good:#6CC08F; --good-soft:#1E3327; --warn:#E0B060; --warn-soft:#3A2F17; --bad:#E27C7C; --bad-soft:#3B2222;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,textarea,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:140px;resize:vertical;line-height:1.55}
h1,h2,h3{margin:0;text-wrap:balance}
.app{display:flex;flex-direction:column;min-height:100dvh}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:52px}
.top .brand{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:.12em}
.top .sub{color:var(--muted);font-size:13px;margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.top .back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;margin-left:-8px}
.top .back:hover{background:var(--surface2)}
main{flex:1;padding:16px 16px 96px;max-width:720px;width:100%;margin:0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;font-size:11px;color:var(--muted);letter-spacing:.02em}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.tabs button .badge{position:absolute;transform:translate(14px,-4px);background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:600;padding:0 5px;border-radius:9px;line-height:16px}
.tabs button{position:relative}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;min-height:40px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.big{width:64px;height:64px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.icon.big svg{width:28px;height:28px}
.icon.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(178,58,58,.45)}50%{box-shadow:0 0 0 12px rgba(178,58,58,0)}}
@media (prefers-reduced-motion:reduce){.icon.rec{animation:none}}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);letter-spacing:.02em}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.lang{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono)}
/* library */
.pack{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:left;width:100%}
.pack:hover{background:var(--surface2)}
.pack .title{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.25}
.pack .meta{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:8px;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--accent)} .bar .p{background:var(--warn)}
/* reading */
.sentence{font-family:var(--serif);font-size:27px;line-height:1.38;font-weight:400;letter-spacing:-.005em}
@media (min-width:480px){.sentence{font-size:31px}}
.sentence .w{border-radius:4px;padding:0 1px;transition:background .15s}
.sentence .w:hover{background:var(--surface2)}
.sentence .w.hl{background:var(--accent-soft);color:var(--accent)}
.sentence .w.ok{color:var(--good)}
.sentence .w.miss{color:var(--bad);text-decoration:underline;text-decoration-style:wavy;text-underline-offset:4px;text-decoration-thickness:1.5px}
.ipa{font-family:var(--mono);font-size:14px;color:var(--muted);margin-top:10px;line-height:1.6;word-break:break-word}
.trans{margin-top:10px;font-size:14px;color:var(--muted);line-height:1.55}
.trans.hidden span{filter:blur(6px);cursor:pointer;user-select:none}
.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.controls .mid{display:flex;align-items:center;gap:14px}
.rate{font-family:var(--mono);font-size:12px;font-weight:500}
.result{border-radius:12px;padding:12px 14px;background:var(--surface2);display:flex;flex-direction:column;gap:8px}
.score{font-family:var(--mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.heard{font-size:14px;color:var(--muted);font-style:italic}
.section h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.notes{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.notes li{padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:14px;line-height:1.55;border-left:3px solid var(--accent)}
.chunks{display:flex;flex-direction:column;gap:6px}
.chunk{display:flex;align-items:baseline;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.chunk .p{font-family:var(--serif);font-size:17px;flex:1}
.chunk .m{font-size:13px;color:var(--muted);flex:1}
.vocab{display:flex;flex-direction:column;gap:6px}
.v{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.v .w{font-family:var(--serif);font-size:18px;font-weight:500}
.v .m{font-size:13px;color:var(--muted);flex:1;min-width:0}
.v .n{font-size:12px;color:var(--muted);display:block}
.v .add{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.v .add.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.v .add svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .pos{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{display:block;width:6px;height:6px;border-radius:2px;background:var(--surface2)}
.dots i.p{background:var(--warn)} .dots i.m{background:var(--accent)} .dots i.cur{outline:2px solid var(--ink);outline-offset:1px}
.coach-cta{border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.coach-cta p{margin:0;font-size:14px;color:var(--muted);max-width:40ch}
.thinking{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.thinking i{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* memorize */
.cloze{font-family:var(--serif);font-size:27px;line-height:1.5}
.cloze .h{display:inline-block;border-bottom:2px solid var(--accent);color:var(--accent);font-family:var(--mono);font-size:16px;padding:0 4px;min-width:2.2em;text-align:left;vertical-align:baseline;letter-spacing:.06em;cursor:pointer;border-radius:4px 4px 0 0;background:var(--accent-soft)}
.cloze .h.rev{background:transparent;font-family:var(--serif);font-size:27px;letter-spacing:0;color:var(--ink);border-bottom-color:var(--line)}
.levels{display:flex;gap:6px}
.levels button{flex:1;padding:8px 0;border:1px solid var(--line);border-radius:10px;font-family:var(--mono);font-size:12px;font-weight:500}
.levels button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* cards */
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:24px 16px}
.flash .front{font-family:var(--serif);font-size:36px;font-weight:500;line-height:1.2}
.flash .back{font-size:17px}
.flash .src{font-family:var(--serif);font-size:15px;color:var(--muted);font-style:italic;max-width:40ch}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{padding:10px 4px;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;align-items:center;font-weight:500}
.grades button small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.grades .g0{color:var(--bad)} .grades .g3{color:var(--good)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px}
.list .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.list .it .w{font-family:var(--serif);font-size:16px;font-weight:500}
.list .it .m{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,22,26,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--serif);font-size:22px;font-weight:500}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.hero{padding:6px 0 14px}
.hero h1{font-family:var(--serif);font-size:34px;font-weight:400;line-height:1.1;letter-spacing:-.01em}
.hero p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:48ch}
details.adv summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none}
details.adv summary::before{content:"▸ ";} details.adv[open] summary::before{content:"▾ ";}
</style>

<script>
/* ============ constants ============ */
const LANGS={
  en:{name:"English",code:"en-US",ko:"영어"},
  es:{name:"Español",code:"es-ES",ko:"스페인어"},
  fr:{name:"Français",code:"fr-FR",ko:"프랑스어"},
  it:{name:"Italiano",code:"it-IT",ko:"이태리어"},
  de:{name:"Deutsch",code:"de-DE",ko:"독어"}
};
const RATES=[0.6,0.8,1.0];
const BATCH=8;
const ICONS={
  lib:'<svg viewBox="0 0 24 24"><path d="M4 4h5v16H4zM10 4h5v16h-5zM16 5l4-1 1 16-4 1z"/></svg>',
  read:'<svg viewBox="0 0 24 24"><path d="M3 5.5C6 4 9 4 12 6c3-2 6-2 9-.5V19c-3-1.5-6-1.5-9 .5-3-2-6-2-9-.5z"/><path d="M12 6v13.5"/></svg>',
  mem:'<svg viewBox="0 0 24 24"><path d="M9 3a4 4 0 0 0-4 4v1a3 3 0 0 0-1 5.5A3.5 3.5 0 0 0 7 20h2z"/><path d="M15 3a4 4 0 0 1 4 4v1a3 3 0 0 1 1 5.5A3.5 3.5 0 0 1 17 20h-2z"/><path d="M9 3v17M15 3v17"/></svg>',
  cards:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v12"/></svg>',
  set:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>',
  stop:'<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  mic:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  back:'<svg viewBox="0 0 24 24" width="22" height="22" style="stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M15 5l-7 7 7 7"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>',
  spark:'<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>',
  vol:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>'
};

/* ============ storage ============ */
const DB=(()=>{
  let p=null, mem=null;
  function open(){
    if(p) return p;
    p=new Promise((res,rej)=>{
      try{
        const r=indexedDB.open("lectio",1);
        r.onupgradeneeded=e=>{const d=e.target.result;["packs","cards","kv"].forEach(n=>{if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:n==="kv"?"k":"id"});});};
        r.onsuccess=e=>res(e.target.result);
        r.onerror=e=>rej(e.target.error);
        r.onblocked=()=>rej(new Error("blocked"));
      }catch(err){rej(err);}
    }).catch(()=>{mem={packs:new Map(),cards:new Map(),kv:new Map()};return null;});
    return p;
  }
  async function tx(store,mode,fn){
    const d=await open();
    if(!d){ const m=mem[store]; const key=store==="kv"?"k":"id";
      return fn({get:k=>({result:m.get(k)}),getAll:()=>({result:[...m.values()]}),put:v=>{m.set(v[key],v);return{}},delete:k=>{m.delete(k);return{}},clear:()=>{m.clear();return{}}}).result; }
    return new Promise((res,rej)=>{const t=d.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r?r.result:undefined);t.onerror=e=>rej(e.target.error);});
  }
  return {
    get:(s,k)=>tx(s,"readonly",st=>st.get(k)),
    all:s=>tx(s,"readonly",st=>st.getAll()),
    put:(s,v)=>tx(s,"readwrite",st=>st.put(v)),
    del:(s,k)=>tx(s,"readwrite",st=>st.delete(k)),
    clear:s=>tx(s,"readwrite",st=>st.clear())
  };
})();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============ text utils ============ */
const ABBR=/\b(M|Mme|Mlle|Dr|Mr|Mrs|Ms|St|Sr|Sra|Srta|Hr|Fr|Frl|Prof|etc|vs|Nr|z\.B|u\.a|d\.h|bzw|ca|p\.ej|Ud|Uds|sig|sigg|dott|avv|Jr|No|Ave)\.$/i;
function splitSentences(text){
  const out=[];
  text.replace(/\r/g,"").split(/\n+/).forEach(par=>{
    const toks=par.trim().split(/\s+/).filter(Boolean);
    let buf=[];
    toks.forEach((t,i)=>{
      buf.push(t);
      const core=t.replace(/[»”"')\]]+$/,"");
      const prev=buf[buf.length-2]||"";
      const ends=/[.!?…]$/.test(core)||(/^[»”"')\]]+$/.test(t)&&/[.!?…]$/.test(prev));
      const nxt=toks[i+1];
      const nextOk=!nxt||/^[«“"'(\[¿¡—–\-A-ZÀ-ÝÄÖÜ0-9]/.test(nxt);
      if(ends&&!ABBR.test(core)&&nextOk){out.push(buf.join(" "));buf=[];}
    });
    if(buf.length) out.push(buf.join(" "));
  });
  return out.map(s=>s.trim()).filter(s=>s.length>1);
}
function tokens(s){
  return s.toLowerCase().replace(/[’‘`´]/g,"'").split(/[\s\-–—]+/).flatMap(w=>w.split("'")).map(w=>w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"")).filter(Boolean);
}
function displayWords(s){ return s.split(/(\s+)/); }
function lev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(!m||!n) return m+n; let prev=[...Array(n+1).keys()],cur=[];
  for(let i=1;i<=m;i++){cur=[i];for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));}prev=cur;} return prev[n]; }
const strip=w=>w.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function same(a,b){ if(a===b) return true; const sa=strip(a),sb=strip(b); if(sa===sb) return true; const L=Math.max(a.length,b.length); return L>=5&&lev(sa,sb)<=1; }
function align(orig,heard){
  const n=orig.length,m=heard.length; const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=same(orig[i],heard[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Array(n).fill(false); let i=0,j=0;
  while(i<n&&j<m){ if(same(orig[i],heard[j])){ok[i]=true;i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  return ok;
}
function scoreOf(ok){ return ok.length?Math.round(100*ok.filter(Boolean).length/ok.length):0; }
/* map token-level matches back to display words */
function markDisplay(sentence,ok){
  const parts=displayWords(sentence); let ti=0;
  return parts.map(p=>{ if(!p.trim()) return p; const tk=tokens(p); if(!tk.length) return `<span class="w">${esc(p)}</span>`;
    const res=tk.map(()=>ok[ti++]); const cls=res.every(Boolean)?"ok":"miss"; return `<span class="w ${cls}">${esc(p)}</span>`; }).join("");
}

/* ============ speech ============ */
const TTS=(()=>{
  let voices=[]; const load=()=>{voices=speechSynthesis.getVoices()||[];};
  if("speechSynthesis" in window){load();speechSynthesis.onvoiceschanged=load;}
  function list(lang){ const pre=lang.slice(0,2); return voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(pre)); }
  function pick(lang){ const want=S.settings.voices[lang]; const ls=list(lang); if(!ls.length) return null;
    if(want){ const v=ls.find(v=>v.voiceURI===want)||ls.find(v=>v.name===want); if(v) return v; }
    const hq=v=>/premium|enhanced|natural|neural|google/i.test(v.name+" "+(v.voiceURI||""));
    return ls.find(v=>v.lang.replace("_","-")===LANGS[lang].code&&hq(v))||ls.find(v=>v.lang.replace("_","-")===LANGS[lang].code)||ls[0]; }
  function tier(v){ const u=(v.voiceURI||"")+" "+v.name; if(/premium/i.test(u)) return "프리미엄"; if(/enhanced/i.test(u)) return "향상됨"; if(/google/i.test(u)) return "Google"; if(/eloquence|novelty|speech\.synthesis\.voice/i.test(u)) return "저품질"; if(/compact/i.test(u)) return "기본"; return ""; }
  function rank(v){ return {"프리미엄":0,"향상됨":1,"Google":2,"":3,"기본":4,"저품질":5}[tier(v)]; }
  let cur=null;
  function speak(text,lang,rate,onBoundary,onEnd){
    if(!("speechSynthesis" in window)){toast("이 브라우저는 음성 합성을 지원하지 않습니다");return;}
    stop(); const u=new SpeechSynthesisUtterance(text); u.lang=LANGS[lang].code; const v=pick(lang); if(v) u.voice=v; u.rate=rate; u.pitch=1;
    u.onboundary=e=>{ if(onBoundary&&e.name==="word") onBoundary(e.charIndex); };
    u.onend=()=>{cur=null;onEnd&&onEnd();}; u.onerror=()=>{cur=null;onEnd&&onEnd();};
    cur=u; speechSynthesis.speak(u);
  }
  function stop(){ if("speechSynthesis" in window){speechSynthesis.cancel();} cur=null; }
  return {speak,stop,list,pick,tier,rank,speaking:()=>!!cur};
})();
const REC=(()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let r=null;
  function start(lang,{continuous=false,onInterim,onFinal,onError,onEnd}){
    if(!SR){onError("unsupported");return null;}
    stop(); r=new SR(); r.lang=LANGS[lang].code; r.interimResults=true; r.continuous=continuous; r.maxAlternatives=1;
    let finalText="";
    r.onresult=e=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) finalText+=" "+t; else interim+=t; } onInterim&&onInterim((finalText+" "+interim).trim()); };
    r.onerror=e=>{ onError&&onError(e.error); };
    r.onend=()=>{ const f=finalText.trim(); r=null; onFinal&&onFinal(f); onEnd&&onEnd(); };
    try{ r.start(); }catch(err){ onError&&onError("start"); return null; }
    return r;
  }
  function stop(){ if(r){ try{r.stop();}catch(e){} } }
  return {start,stop,supported:!!SR,active:()=>!!r};
})();

function coachPrompt(p,from,to){

각 문장에 대해 아래 JSON 형식으로만 답하세요. 코드펜스, 설명문, 인사말 없이 JSON 객체 하나만 출력합니다.

규칙: 문장 번호를 그대로 유지합니다. 문장 텍스트는 바꾸지 않습니다. vocab은 문장당 2~5개, chunks는 2~4개. 학습자 수준은 중급입니다.

문장:
${lines.join("\n")}`;
}
function mergeCoaching(p,items){
  let n=0;
  (items||[]).forEach(it=>{ const i=(+it.i)-1; const s=p.sentences[i]; if(!s) return;
    s.ipa=it.ipa||s.ipa; s.ko=it.ko||s.ko; s.notes=Array.isArray(it.notes)?it.notes:s.notes;
    s.chunks=Array.isArray(it.chunks)?it.chunks:s.chunks; s.vocab=Array.isArray(it.vocab)?it.vocab:s.vocab; n++; });
  return n;
}
function parseCoachJSON(txt){
  let t=txt.trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const a=t.indexOf("{"),b=t.lastIndexOf("}"); if(a>=0&&b>a) t=t.slice(a,b+1);
  const obj=JSON.parse(t); return Array.isArray(obj)?obj:(obj.items||[]);
}
async function runCoach(){
  const p=pack(); if(!p||!S.sample) return;
  const from=S.idx, to=Math.min(p.sentences.length,from+BATCH);
  S.coaching=true; S.coachText=""; render();
  try{
    const out=await S.sample.json(coachPrompt(p,from,to),{modelTier:"default",cache:false,onText:u=>{S.coachText=u.text;const el=document.getElementById("coach-progress");if(el) el.textContent=`생성 중 · ${Math.min(to-from,(u.text.match(/"i"\s*:/g)||[]).length)}/${to-from} 문장`;}});
    const n=mergeCoaching(p,out.items||out); await savePack(p); toast(`${n}문장 코칭 완료`);
  }catch(e){
    if(e&&e.code==="not_granted"){S.settings.sampleDenied=true;saveSettings();toast("Claude 사용이 허용되지 않았습니다. 프롬프트 복사 방식을 이용하세요.");}
    else if(e&&e.code==="rate_limited") toast("잠시 후 다시 시도하세요 (rate limit)");
    else if(e&&e.code==="invalid_json"){ try{ const n=mergeCoaching(p,parseCoachJSON(e.text||"")); await savePack(p); toast(`${n}문장 코칭 완료`);}catch(_){toast("응답을 해석하지 못했습니다. 다시 시도하세요.");} }
    else toast("코칭 생성 실패: "+(e&&e.code||e&&e.message||"unknown"));
  }
  S.coaching=false; render();
}

/* ============ SRS ============ */
const DAY=86400000;
function gradeCard(c,g){
  const now=Date.now(); c.reps=c.reps||0; c.ease=c.ease||2.5; c.interval=c.interval||0;
  if(g===0){ c.reps=0; c.interval=0; c.ease=Math.max(1.3,c.ease-0.2); c.due=now+10*60000; }
  else{
    if(c.reps===0) c.interval=g===3?3:1; else if(c.reps===1) c.interval=g===1?3:g===3?8:6;
    else c.interval=Math.max(1,Math.round(c.interval*c.ease*(g===1?0.8:g===3?1.3:1)));
    c.ease=Math.max(1.3,c.ease+(g===1?-0.15:g===3?0.15:0)); c.reps++; c.due=now+c.interval*DAY;
  }
  c.last=now;
}
function dueCards(){ const now=Date.now(); return S.cards.filter(c=>(c.due||0)<=now).sort((a,b)=>(a.due||0)-(b.due||0)); }
function hasCard(front,packId){ return S.cards.some(c=>c.front===front&&c.packId===packId); }
async function addCard({front,back,note,src}){
  const p=pack(); if(!p) return; if(hasCard(front,p.id)){toast("이미 카드에 있습니다");return;}
  const c={id:uid(),packId:p.id,lang:p.lang,front,back:back||"",note:note||"",src:src||"",due:Date.now(),reps:0,ease:2.5,interval:0,created:Date.now()};
  S.cards.push(c); await DB.put("cards",c); toast("카드 추가: "+front); render();
}

/* ============ cloze ============ */
function seeded(n){ let x=(n*9301+49297)%233280; return ()=>{x=(x*9301+49297)%233280;return x/233280;}; }
function clozeMask(sentence,level,seed){
  const parts=displayWords(sentence); const idxs=parts.map((p,i)=>tokens(p).length?i:-1).filter(i=>i>=0);
  const ratio=[0,0.3,0.55,0.8,1][level]; const rnd=seeded(seed+level*7);
  const order=idxs.map(i=>({i,k:rnd()+(parts[i].replace(/[^\p{L}]/gu,"").length>=5?0.25:0)})).sort((a,b)=>b.k-a.k);
  const hide=new Set(order.slice(0,Math.ceil(idxs.length*ratio)).map(o=>o.i)); return {parts,hide};
}

function wordsHTML(s){ return displayWords(s).map((p,i)=>p.trim()?`<span class="w" data-w="${i}">${esc(p)}</span>`:p).join(""); }
function bindWords(p){

    el.oncontextmenu=e=>{e.preventDefault(); const w=el.textContent.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,""); if(!w) return; const s=sent(); const v=(s.vocab||[]).find(x=>strip(x.w.toLowerCase())===strip(w.toLowerCase())); addCard({front:w,back:v?v.m:"",note:v?v.n:"",src:s.t}); }; });

function playSentence(p,s,idxOverride){
  const btn=$("btn-play"); if(TTS.speaking()){TTS.stop();if(btn) btn.innerHTML=ICONS.play;return;}
  if(btn) btn.innerHTML=ICONS.stop;
  const parts=displayWords(s.t); const starts=[]; let pos=0; parts.forEach(pt=>{starts.push(pos);pos+=pt.length;});
  TTS.speak(s.t,p.lang,RATES[S.rateI],ci=>{ let k=0; for(let i=0;i<parts.length;i++){ if(starts[i]<=ci) k=i; } $("main").querySelectorAll(".sentence .w").forEach(w=>w.classList.remove("hl")); const el=$("main").querySelector(`.sentence .w[data-w="${k}"]`); el&&el.classList.add("hl"); },
    ()=>{ $("main").querySelectorAll(".sentence .w").forEach(w=>w.classList.remove("hl")); if(btn) btn.innerHTML=ICONS.play; });
}
function startRecord(p,target,onDone){
  if(!REC.supported){toast("이 브라우저는 음성 인식을 지원하지 않습니다 (Chrome 또는 Safari 권장)");return;}

  REC.start(p.lang,{continuous:S.chain>1&&S.view==="memo",
    onInterim:t=>{S.heard=t;const h=$("heard");if(h) h.textContent=t;},
    onFinal:t=>{ S.recording=false; if(!t){ render(); return; } const ok=align(tokens(target),tokens(t)); const sc=scoreOf(ok); onDone(ok,sc,t); },
    onError:err=>{ S.recording=false; if(err==="not-allowed"||err==="service-not-allowed") toast("마이크 권한이 필요합니다. 이 화면에서 막혀 있으면 GitHub Pages 버전에서 사용하세요."); else if(err==="no-speech") toast("음성이 감지되지 않았습니다"); else if(err!=="aborted") toast("인식 오류: "+err); render(); }});
}

function coachCTA(p){

  const ai=S.sample&&!S.settings.sampleDenied;
  return `<div class="coach-cta">
    <p>이 문장에는 아직 코칭이 없습니다. ${from}번부터 ${to}번까지 ${to-from+1}문장을 한 번에 받습니다.</p>
    ${ai?`<button class="btn primary" id="coach-ai">${ICONS.spark} Claude 코칭 받기</button><p class="small">Claude 구독 사용량으로 처리됩니다 · 별도 API 요금 없음</p>`:""}

    ${ai?"":`<p class="small">복사한 프롬프트를 Claude 앱에 붙여넣고, 받은 JSON을 여기에 넣으면 됩니다.</p>`}

}
function bindCoach(p){

/* ============ memorize ============ */
function renderMemo(){
  const p=pack(); if(!p){go("library");return;} const s=sent(); const L=LANGS[p.lang];
  setTop(`<button class="back" id="back" aria-label="서재로">${ICONS.back}</button><span style="font-family:var(--serif);font-size:17px;font-weight:500">암기</span><span class="sub">${esc(p.title)}</span>`);
  const lvl=S.clozeLevel; const {parts,hide}=clozeMask(s.t,lvl,S.idx+1);
  const html=parts.map((pt,i)=>{ if(!hide.has(i)) return esc(pt); const core=pt.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,""); const pre=pt.slice(0,pt.indexOf(core)); const post=pt.slice(pre.length+core.length);
    const rev=S.revealed.has(i); return `<span style="white-space:nowrap">${esc(pre)}<span class="h ${rev?"rev":""}" data-h="${i}">${rev?esc(core):esc(core[0])+"·".repeat(Math.max(1,core.length-1))}</span>${esc(post)}</span>`; }).join("");
  const chainText=p.sentences.slice(S.idx,S.idx+S.chain).map(x=>x.t).join(" ");
  const res=S.result;
  $("main").innerHTML=`<div class="stack">
    ${navHTML(p)}
    <div class="levels">${[1,2,3,4].map(l=>`<button data-l="${l}" class="${l===lvl?"on":""}">L${l} · ${[0,30,55,80,100][l]}%</button>`).join("")}</div>
    <div class="card"><div class="cloze" lang="${L.code}">${html}</div>${s.ko?`<div class="trans">${esc(s.ko)}</div>`:""}</div>
    <div class="controls">
      <button class="btn sm" id="chain">${S.chain===1?"1문장":S.chain+"문장 이어서"}</button>
      <div class="mid"><button class="icon" id="btn-play" aria-label="듣기">${ICONS.play}</button>
      <button class="icon big ${S.recording?"rec":""}" id="btn-rec" aria-label="암송">${S.recording?ICONS.stop:ICONS.mic}</button>
      <button class="icon" id="btn-reveal" aria-label="전부 보기">${ICONS.check}</button></div>
      <span style="width:64px"></span>
    </div>
    ${S.recording?`<div class="result"><div class="thinking"><i></i>암송 중… ${S.chain>1?"끝나면 ■ 을 누르세요":""}</div><div class="heard" id="heard">${esc(S.heard)}</div></div>`:""}
    ${res?`<div class="result"><div class="row"><span class="score" style="color:${res.score>=85?"var(--good)":res.score>=65?"var(--warn)":"var(--bad)"}">${res.score}%</span><span class="small muted">${res.passed?`통과 — 다음 단계 L${Math.min(4,lvl+1)}${lvl===4?" 완성":""}`:"85% 이상이면 다음 단계로 넘어갑니다"}</span></div><div class="sentence" style="font-size:18px">${markDisplay(chainText,res.ok)}</div><div class="heard">“${esc(res.heard)}”</div></div>`:""}
    <p class="small muted" style="margin:0">가려진 단어는 첫 글자만 보입니다. 누르면 드러납니다. L1→L4로 올라갈수록 더 많이 가려지고, L4에서 85% 이상 암송하면 그 문장은 완성으로 표시됩니다.</p>
  </div>`;
  $("back").onclick=()=>go("library"); bindNav(p);
  $("main").querySelectorAll(".levels button").forEach(b=>b.onclick=()=>{S.clozeLevel=+b.dataset.l;S.revealed=new Set();S.result=null;render();});
  $("main").querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{S.revealed.add(+b.dataset.h);render();});
  $("btn-reveal").onclick=()=>{parts.forEach((_,i)=>S.revealed.add(i));render();};
  $("chain").onclick=()=>{S.chain=S.chain===1?3:S.chain===3?5:1;S.result=null;render();};
  $("btn-play").onclick=()=>{ const btn=$("btn-play"); if(TTS.speaking()){TTS.stop();btn.innerHTML=ICONS.play;return;} btn.innerHTML=ICONS.stop; TTS.speak(chainText,p.lang,RATES[S.rateI],null,()=>btn.innerHTML=ICONS.play); };
  $("btn-rec").onclick=()=>{ if(S.recording){REC.stop();return;} startRecord(p,chainText,async(ok,sc,heard)=>{ const passed=sc>=85; S.result={ok,score:sc,heard,passed};
      if(passed){ for(let k=0;k<S.chain;k++){ const x=p.sentences[S.idx+k]; if(!x) break; x.cloze=Math.max(x.cloze||0,lvl); x.attempts=(x.attempts||0)+1; if(sc>(x.best||0)&&lvl>=3) x.best=Math.max(x.best||0,sc); } if(lvl<4) S.clozeLevel=lvl+1; }
      await savePack(p); S.revealed=new Set(); render(); }); };
}

function intervalLabel(c,g){ const t={...c}; gradeCard(t,g); if(g===0) return "10분"; return t.interval+"일"; }

  setTop(`<span class="brand">LECTIO</span><span class="sub">설정</span>`);
  const voiceRows=Object.entries(LANGS).map(([k,v])=>{ const ls=TTS.list(k); const cur=TTS.pick(k);
    return `<label class="f">${v.ko} 음성 <select data-voice="${k}">${ls.length?ls.slice().sort((a,b)=>TTS.rank(a)-TTS.rank(b)).map(x=>`<option value="${esc(x.voiceURI||x.name)}" ${cur&&(cur.voiceURI||cur.name)===(x.voiceURI||x.name)?"selected":""}>${TTS.tier(x)?"★ ".repeat(TTS.rank(x)<2?1:0)+"["+TTS.tier(x)+"] ":""}${esc(x.name)} (${x.lang})</option>`).join(""):"<option>기기에 음성 없음</option>"}</select></label>`; }).join("");
  $("main").innerHTML=`<div class="stack">
    <div class="card stack">
      <div class="eyebrow">음성</div>
      ${voiceRows}
      <p class="small muted" style="margin:0">[향상됨]·[프리미엄] 표시는 기기가 알려주는 음성 식별자(voiceURI)로 판별합니다. 이름이 같은 음성이 두 개 보이면 표시가 붙은 쪽이 고품질입니다.</p>
      <p class="small muted" style="margin:0">iPhone은 설정 › 손쉬운 사용 › 음성 콘텐츠 › 음성에서 언어별 고품질 음성을 내려받으면 여기 목록에 나타납니다. Android는 Google TTS 설정에서 언어별 음성을 설치하세요.</p>
      <label class="f">기본 재생 속도 <select id="set-rate">${RATES.map((r,i)=>`<option value="${i}" ${i===S.rateI?"selected":""}>${r.toFixed(1)}×</option>`).join("")}</select></label>
    </div>
    <div class="card stack">
      <div class="eyebrow">AI 코칭</div>
      <p class="small" style="margin:0">${aiStatusText()}</p>
      <p class="small muted" style="margin:0">한 번에 ${BATCH}문장씩 처리합니다. 코칭은 한국어 설명 + 원어 용어(liaison, schwa, stress …)로 작성됩니다.</p>
    </div>
    <div class="card stack">
      <div class="eyebrow">대본</div>
      ${S.packs.map(p=>`<div class="row"><span class="lang">${p.lang.toUpperCase()}</span><span class="grow" style="font-family:var(--serif)">${esc(p.title)}</span><button class="btn sm" data-exp="${p.id}">내보내기</button><button class="btn sm ghost danger" data-delp="${p.id}">삭제</button></div>`).join("")||"<div class='muted small'>대본 없음</div>"}
    </div>
    <div class="card stack">
      <div class="eyebrow">백업</div>
      <div class="row"><button class="btn" id="bk-out">전체 백업 복사</button><button class="btn" id="bk-in">백업 불러오기</button></div>
      <p class="small muted" style="margin:0">데이터는 이 기기의 브라우저 안에만 저장됩니다. 다른 기기로 옮기려면 백업을 복사해 붙여넣으세요.</p>
    </div>
    <p class="small muted" style="text-align:center">LECTIO · 낭독·암송 트레이너 · TTS와 음성 인식은 기기 내장 엔진을 사용합니다</p>
  </div>`;
  $("main").querySelectorAll("[data-voice]").forEach(sl=>sl.onchange=()=>{S.settings.voices[sl.dataset.voice]=sl.value;saveSettings();TTS.speak({en:"Good evening.",es:"Buenas noches.",fr:"Bonsoir.",it:"Buonasera.",de:"Guten Abend."}[sl.dataset.voice],sl.dataset.voice,0.9);});
  $("set-rate").onchange=e=>{S.rateI=+e.target.value;S.settings.rate=RATES[S.rateI];saveSettings();};
  const exportText=obj=>{ const txt=JSON.stringify(obj); navigator.clipboard.writeText(txt).then(()=>toast("복사했습니다")).catch(()=>sheet(`<h2>백업</h2><textarea style="min-height:240px" readonly>${esc(txt)}</textarea><button class="btn" data-close>닫기</button>`)); };
  $("main").querySelectorAll("[data-exp]").forEach(b=>b.onclick=()=>exportText({packs:[S.packs.find(p=>p.id===b.dataset.exp)],cards:S.cards.filter(c=>c.packId===b.dataset.exp)}));
  $("main").querySelectorAll("[data-delp]").forEach(b=>b.onclick=async()=>{ const p=S.packs.find(x=>x.id===b.dataset.delp); if(!confirm(`'${p.title}' 대본과 그 카드를 삭제할까요?`)) return; S.packs=S.packs.filter(x=>x.id!==p.id); await DB.del("packs",p.id); for(const c of S.cards.filter(c=>c.packId===p.id)) await DB.del("cards",c.id); S.cards=S.cards.filter(c=>c.packId!==p.id); if(S.packId===p.id) S.packId=null; render(); });
  $("bk-out").onclick=()=>exportText({packs:S.packs,cards:S.cards,settings:S.settings});
  $("bk-in").onclick=openImport;
}

/* ============ sheet ============ */
function sheet(html){ $("overlay").innerHTML=`<div class="sheet-bg" id="sheet-bg"><div class="sheet" role="dialog">${html}</div></div>`; $("sheet-bg").onclick=e=>{if(e.target.id==="sheet-bg") closeSheet();}; $("overlay").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet); }
function closeSheet(){ $("overlay").innerHTML=""; }

/* ============ snapshot (hot reload) ============ */
function snapshot(){ try{ window.claude?.hot?.snapshot?.({view:S.view,packId:S.packId,idx:S.idx,clozeLevel:S.clozeLevel}); }catch(e){} }

/* ============ boot ============ */
async function boot(){
  try{ S.packs=await DB.all("packs")||[]; S.cards=await DB.all("cards")||[]; const kv=await DB.get("kv","settings"); if(kv&&kv.v) S.settings={...S.settings,...kv.v}; }catch(e){}
  S.rateI=Math.max(0,RATES.indexOf(S.settings.rate)); if(S.rateI<0) S.rateI=1;
  S.settings.sampleDenied=false;
  if(!S.packs.length){ const flag=await DB.get("kv","seeded").catch(()=>null); if(!flag){ const sp=samplePack(); S.packs.push(sp); await savePack(sp); await DB.put("kv",{k:"seeded",v:1}); } }
  try{ const gf=await DB.get("kv","gloss1").catch(()=>null); if(!gf){ for(const gp of glossaryPacks()){ if(!S.packs.some(p=>p.id===gp.id)){ S.packs.push(gp); await savePack(gp); } } await DB.put("kv",{k:"gloss1",v:1}); } }catch(e){}
  const hot=window.claude?.hot?.data; if(hot&&hot.packId&&S.packs.some(p=>p.id===hot.packId)){ S.packId=hot.packId; S.idx=hot.idx||0; S.view=hot.view||"library"; S.clozeLevel=hot.clozeLevel||1; }
  render(); initSample();
  if("speechSynthesis" in window) speechSynthesis.addEventListener("voiceschanged",()=>{ if(S.view==="settings") render(); });
}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot();
